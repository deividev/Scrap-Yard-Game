<div class="statistics-panel" [class.collapsed]="isCollapsed()">
  <button class="statistics-header" (click)="toggleCollapse()" type="button">
    <span class="statistics-title">{{ t.t('statistics.title') }}</span>
    <span class="collapse-icon">{{ isCollapsed() ? '▶' : '▼' }}</span>
  </button>

  <div class="statistics-grid" [class.grid-hidden]="isCollapsed()">
    <div class="stat-item">
      <span class="stat-label">{{ t.t('statistics.total_scrap') }}</span>
      <span class="stat-value" [class.flashing]="flashingStats().has('scrap')">{{
        statisticsService.totalScrapGenerated() | formatNumber
      }}</span>
    </div>

    <div class="stat-item">
      <span class="stat-label">{{ t.t('statistics.play_time') }}</span>
      <span class="stat-value" [class.flashing]="flashingStats().has('time')">{{
        statisticsService.playTimeFormatted()
      }}</span>
    </div>

    <div class="stat-item">
      <span class="stat-label">{{ t.t('statistics.active_machines') }}</span>
      <span class="stat-value" [class.flashing]="flashingStats().has('machines')">{{
        statisticsService.activeMachinesCount()
      }}</span>
    </div>
  </div>
</div>
